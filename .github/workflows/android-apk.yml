name: Android APK • AJD's Wireless Repairs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  android-apk:
    name: Build downloadable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out current website and Android sources
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools and API 35
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/android-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon -p android assembleDebug

      - name: Prepare easy-download APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/AJD-Wireless-Repairs-Admin.apk
          cd dist
          sha256sum AJD-Wireless-Repairs-Admin.apk > SHA256SUMS.txt

      - name: Upload workflow APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AJD-Wireless-Repairs-Admin-APK
          path: dist/*
          retention-days: 90
          if-no-files-found: error

      - name: Publish latest APK as an easy-to-find GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --target "$GITHUB_SHA" \
              --title "AJD Wireless Repairs — Android APK" \
              --notes "Installable Android admin app. Download the .apk below. Uses secure Supabase admin sign-in and opens the current hosted website." \
              --prerelease
          fi
          gh release upload android-latest dist/AJD-Wireless-Repairs-Admin.apk dist/SHA256SUMS.txt --clobber
