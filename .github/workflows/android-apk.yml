name: Android APK • AJD's Wireless Repairs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  android-apk:
    name: Build downloadable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out current website and Android sources
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon -p android assembleDebug

      - name: Prepare easy-download APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/AJD-Wireless-Repairs-Admin.apk
          cd dist
          sha256sum AJD-Wireless-Repairs-Admin.apk > SHA256SUMS.txt

      - name: Upload workflow APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AJD-Wireless-Repairs-Admin-APK
          path: dist/*
          retention-days: 90
          if-no-files-found: error

      - name: Publish latest APK as an easy-to-find GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --target "$GITHUB_SHA" \
              --title "AJD Wireless Repairs — Android APK" \
              --notes "Installable Android admin app. Download the .apk below. Uses secure Supabase admin sign-in and opens the current hosted website." \
              --prerelease
          fi
          gh release upload android-latest dist/AJD-Wireless-Repairs-Admin.apk dist/SHA256SUMS.txt --clobber
