name: Refresh matching AJD app icons
on:
  push:
    branches: [main]
    paths:
      - 'ajd-logo.svg'
      - 'scripts/generate-brand-assets.py'
      - '.github/workflows/brand-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ajd-repair-brand-assets
  cancel-in-progress: false

jobs:
  refresh-icons:
    name: Update favicon and installed-app icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight SVG renderer
        run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Generate consistent icons
        run: python scripts/generate-brand-assets.py
      - name: Commit generated icon files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ajd-logo-32.png admin-icon-192.png admin-icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Update PWA and favicon PNGs from new AJD blue-A logo"
            # Other pages may be updated while this workflow renders icons.
            # Rebase our generated binary-only commit before pushing to avoid
            # rejecting a valid refresh of the new AJD logo.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin "HEAD:main"; then
                exit 0
              fi
              sleep 2
            done
            echo "Unable to publish regenerated icon files after three attempts" >&2
            exit 1
          fi
