<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AJD's Wireless Repairs - Live Repair Tracker</title>
  <meta name="theme-color" content="#2563eb">
  
  <!-- Tailwind CSS & Supabase JS SDK -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8'
            }
          }
        }
      }
    }
  </script>

  <style>
    @keyframes pulse-light {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.98); }
    }
    .status-pulse {
      animation: pulse-light 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
      }
      .no-print {
        display: none !important;
      }
      .printable-card {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">

  <header class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 px-4 py-4 sticky top-0 z-30">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-white dark:bg-slate-900 text-slate-900 dark:text-white p-1.5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-md flex items-center justify-center shrink-0">
          <svg class="w-8 h-8" viewBox="0 0 100 100" fill="none" stroke="currentColor">
            <circle cx="50" cy="50" r="42" stroke-width="6"/>
            <path d="M30 68h12M36 68L50 28M42 53h18M38 28c4-3 9-2 12 0M50 28c8 20 16 33 26 42" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-black tracking-tight text-slate-900 dark:text-white leading-tight">AJD's Wireless Repairs</h1>
          <p class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">Customer Live Status Portal</p>
        </div>
      </div>

      <button onclick="window.print()" class="no-print px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-xl shadow transition flex items-center space-x-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
        <span>Print Receipt</span>
      </button>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-6">
    <div id="trackerContent" class="bg-white dark:bg-slate-800 p-6 sm:p-8 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-700 printable-card space-y-6">
      <div class="text-center py-12 space-y-3">
        <svg class="animate-spin w-8 h-8 text-brand-600 mx-auto" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <p class="text-sm font-semibold text-slate-500 dark:text-slate-400">Fetching live repair status from server...</p>
      </div>
    </div>
  </main>

  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none no-print"></div>

  <script>
    const SUPABASE_URL = 'https://vxpufrahrnwmtgltjstd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_tRjMtsoo9aT-6n7dzj9p-w_HsUqJ520';
    let supabaseClient = null;
    let currentJobId = null;

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(message) {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold text-white bg-slate-800 transition-all duration-300 transform translate-y-2 opacity-0 flex items-center space-x-2';
      toast.innerHTML = `<span>ℹ️</span><span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.parentNode && toast.parentNode.removeChild(toast), 300);
      }, 3500);
    }

    function getJobIdFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('id')) return urlParams.get('id');
      const hash = window.location.hash;
      if (hash && hash.includes('track=')) return hash.split('track=')[1].split('&')[0];
      if (hash && hash.startsWith('#')) return hash.substring(1);
      return null;
    }

    function normalizeRepair(item) {
      let desc = item.description || '';
      let meta = {};
      const metaMatch = desc.match(/\[META:({.*?})\]/);
      if (metaMatch) {
        try {
          meta = JSON.parse(metaMatch[1]);
          desc = desc.replace(/\[META:{.*?}\]/, '').trim();
        } catch (e) {}
      }

      const amount = parseFloat(item.amount) || 0;
      const partPrice = parseFloat(item.part_price !== undefined ? item.part_price : (meta.part_price !== undefined ? meta.part_price : 0)) || 0;
      const laborPrice = parseFloat(item.labor_price !== undefined ? item.labor_price : (meta.labor_price !== undefined ? meta.labor_price : Math.max(0, amount - partPrice))) || 0;
      const depositAmount = parseFloat(item.deposit_amount !== undefined ? item.deposit_amount : (meta.deposit_amount !== undefined ? meta.deposit_amount : 0)) || 0;

      return {
        id: String(item.id),
        customerName: item.customer_name || item.customerName || 'Valued Customer',
        deviceType: item.device_type || item.deviceType || 'Device',
        makeModel: item.make_model || item.makeModel || 'Hardware Unit',
        modelNumber: item.model_number || item.modelNumber || meta.model_number || '',
        partName: item.part_name || item.partName || meta.part_name || '',
        partPrice: partPrice,
        laborPrice: laborPrice,
        amount: amount,
        depositAmount: depositAmount,
        balanceDue: Math.max(0, amount - depositAmount),
        paymentInfo: item.payment_info || item.paymentInfo || meta.payment_info || 'Zelle: repairs@ajd.com | CashApp: $AJDRepairs | Cash accepted at pickup',
        description: desc,
        status: item.status || 'pending',
        created_at: item.created_at || new Date().toISOString()
      };
    }

    function renderCustomerPortal(rawItem) {
      const container = document.getElementById('trackerContent');
      if (!container) return;

      if (!rawItem) {
        container.innerHTML = `
          <div class="text-center py-12 space-y-3">
            <div class="w-12 h-12 bg-amber-100 dark:bg-amber-900/40 text-amber-600 rounded-2xl mx-auto flex items-center justify-center text-xl font-bold">❓</div>
            <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100">Repair Job Not Found</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400 max-w-sm mx-auto">We couldn't locate a repair order matching this link. Please check your tracking URL or contact AJD's Wireless Repairs.</p>
          </div>
        `;
        return;
      }

      const item = normalizeRepair(rawItem);
      const step = item.status === 'completed' ? 4 : item.status === 'in-progress' ? 2 : 1;

      container.innerHTML = `
        <div class="text-center space-y-2 border-b border-slate-100 dark:border-slate-700 pb-6">
          <div class="w-16 h-16 bg-brand-600 text-white rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-3">
            <svg class="w-10 h-10" viewBox="0 0 100 100" fill="none" stroke="currentColor">
              <circle cx="50" cy="50" r="42" stroke-width="6"/>
              <path d="M30 68h12M36 68L50 28M42 53h18M38 28c4-3 9-2 12 0M50 28c8 20 16 33 26 42" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h2 class="text-2xl font-black text-slate-900 dark:text-white">AJD's Wireless Repairs</h2>
          <p class="text-xs text-slate-500 dark:text-slate-400 font-semibold">Live Device Repair Tracking Portal</p>
        </div>

        <div class="space-y-4">
          <div class="flex items-center justify-between text-xs font-bold">
            <span class="text-slate-400">Customer: <span class="text-slate-800 dark:text-slate-100">${escapeHtml(item.customerName)}</span></span>
            <span class="text-slate-400">Device: <span class="text-slate-800 dark:text-slate-100">${escapeHtml(item.makeModel)}</span></span>
          </div>

          <!-- Progress Pipeline -->
          <div class="relative py-4">
            <div class="overflow-hidden h-3 text-xs flex rounded-full bg-slate-100 dark:bg-slate-700">
              <div style="width: ${step === 4 ? '100%' : step === 2 ? '60%' : '25%'}" class="shadow-none flex flex-col text-center whitespace-nowrap text-white justify-center bg-brand-600 transition-all duration-700"></div>
            </div>
            <div class="grid grid-cols-3 text-[11px] font-bold text-center mt-3 text-slate-400">
              <span class="${step >= 1 ? 'text-brand-600 dark:text-brand-400' : ''}">1. Checked In</span>
              <span class="${step >= 2 ? 'text-brand-600 dark:text-brand-400' : ''}">2. Hardware Repair</span>
              <span class="${step === 4 ? 'text-emerald-600 dark:text-emerald-400' : ''}">3. Ready For Pickup</span>
            </div>
          </div>
        </div>

        <!-- Financial Summary -->
        <div class="bg-slate-50 dark:bg-slate-900/60 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-2 text-xs">
          <div class="flex justify-between font-semibold">
            <span>Total Quoted Cost:</span>
            <span class="font-black text-slate-800 dark:text-slate-100">$${item.amount.toFixed(2)}</span>
          </div>
          <div class="flex justify-between text-indigo-600 dark:text-indigo-400 font-semibold">
            <span>Deposit Paid:</span>
            <span>-$${item.depositAmount.toFixed(2)}</span>
          </div>
          <div class="flex justify-between text-sm font-black text-rose-600 dark:text-rose-400 pt-2 border-t border-slate-200 dark:border-slate-700">
            <span>Balance Due at Pickup:</span>
            <span>$${item.balanceDue.toFixed(2)}</span>
          </div>
        </div>

        <!-- Payment Instructions -->
        <div class="bg-brand-50/60 dark:bg-brand-950/20 p-4 rounded-2xl border border-brand-100 dark:border-brand-900/40 space-y-2">
          <p class="text-xs font-bold text-brand-700 dark:text-brand-300 uppercase tracking-wider">💳 Payment Handles & Pickup Info</p>
          <p class="text-xs text-slate-700 dark:text-slate-200 font-medium leading-relaxed">${escapeHtml(item.paymentInfo)}</p>
        </div>
      `;
    }

    async function loadTrackedJob() {
      currentJobId = getJobIdFromUrl();
      if (!currentJobId) {
        renderCustomerPortal(null);
        return;
      }

      try {
        if (window.supabase && typeof window.supabase.createClient === 'function') {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }
      } catch (e) {
        console.warn("Supabase initialization error:", e);
      }

      if (supabaseClient) {
        const { data, error } = await supabaseClient
          .from('repairs')
          .select('*')
          .eq('id', currentJobId)
          .single();

        if (data) {
          renderCustomerPortal(data);
          subscribeToLiveUpdates();
          return;
        }
      }

      // Fallback check against local backup
      const localData = JSON.parse(localStorage.getItem('ajd_repairs_backup')) || [];
      const match = localData.find(r => String(r.id) === String(currentJobId));
      renderCustomerPortal(match || null);
    }

    function subscribeToLiveUpdates() {
      if (!supabaseClient || !currentJobId) return;

      try {
        supabaseClient
          .channel(`customer_tracker_${currentJobId}`)
          .on('postgres_changes', {
            event: 'UPDATE',
            schema: 'public',
            table: 'repairs',
            filter: `id=eq.${currentJobId}`
          }, (payload) => {
            if (payload.new) {
              renderCustomerPortal(payload.new);
              showToast("Status updated live by technician!");
            }
          })
          .subscribe();
      } catch (e) {
        console.warn("WebSocket subscription bypassed:", e);
      }
    }

    window.onload = loadTrackedJob;
  </script>
</body>
</html>
