<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AJD's Wireless Repairs - Live Repair Tracker</title>
  <meta name="theme-color" content="#0B0F19">
  
  <!-- Tailwind CSS & Supabase SDK -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkbg: '#0B0F19',
            cardbg: '#131B2E',
            cardborder: '#1E293B',
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0B0F19;
      color: #F8FAFC;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .dark-card {
      background-color: #131B2E;
      border: 1px solid #1E293B;
    }
    @media print {
      body { background-color: #ffffff !important; color: #000000 !important; }
      .no-print { display: none !important; }
      .printable-card { border: none !important; box-shadow: none !important; padding: 0 !important; }
    }
  </style>
</head>
<body class="bg-[#0B0F19] text-slate-100 min-h-screen antialiased">

  <!-- Header -->
  <header class="bg-[#0B0F19]/90 backdrop-blur-md border-b border-slate-800 px-4 py-4 sticky top-0 z-30 no-print">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-slate-900 text-white p-2 rounded-2xl border border-slate-800 shadow-md flex items-center justify-center shrink-0 w-10 h-10">
          <svg class="w-7 h-7" viewBox="0 0 100 100" fill="none" stroke="currentColor">
            <circle cx="50" cy="50" r="42" stroke-width="6"/>
            <path d="M30 68h12M36 68L50 28M42 53h18M38 28c4-3 9-2 12 0M50 28c8 20 16 33 26 42" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-black tracking-tight text-white leading-tight">AJD's Wireless Repairs</h1>
          <p class="text-[11px] font-semibold text-slate-400">Customer Live Status Portal</p>
        </div>
      </div>

      <button type="button" onclick="handlePrint()" class="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-xl shadow transition transform active:scale-95 cursor-pointer flex items-center space-x-1.5">
        <span>Print Receipt</span>
      </button>
    </div>
  </header>

  <!-- Main Tracking Container -->
  <main class="max-w-2xl mx-auto px-4 py-6">
    <div id="trackerContent" class="dark-card p-6 sm:p-8 rounded-3xl shadow-2xl printable-card space-y-6">
      <div class="text-center py-12 space-y-3">
        <svg class="animate-spin w-8 h-8 text-brand-500 mx-auto" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <p class="text-xs font-bold text-slate-400">Connecting to repair database...</p>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://vxpufrahrnwmtgltjstd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_tRjMtsoo9aT-6n7dzj9p-w_HsUqJ520';
    let supabaseClient = null;
    let realtimeChannel = null;
    let trackPollingTimer = null;

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function handlePrint() {
      try { window.print(); } catch (e) {}
    }

    function getJobIdFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('id')) return urlParams.get('id');
      if (urlParams.has('track')) return urlParams.get('track');
      const hash = window.location.hash;
      if (hash && hash.includes('track=')) return hash.split('track=')[1].split('&')[0];
      if (hash && hash.startsWith('#')) return hash.substring(1);
      return null;
    }

    async function loadTrackedJob() {
      const jobId = getJobIdFromUrl();
      const container = document.getElementById('trackerContent');
      if (!container) return;

      if (!jobId) {
        container.innerHTML = `<div class="text-center py-12 space-y-2"><p class="text-xl">❓</p><h2 class="text-base font-bold text-white">No Tracking ID Provided</h2></div>`;
        return;
      }

      try {
        if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      } catch (e) {}

      let job = null;
      const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(jobId);

      if (supabaseClient && isUuid) {
        try {
          const { data } = await supabaseClient.from('repairs').select('*').eq('id', jobId).single();
          if (data) job = data;
        } catch (e) {}
      }

      if (!job) {
        const local = JSON.parse(localStorage.getItem('ajd_repairs_backup')) || [];
        job = local.find(r => String(r.id) === String(jobId));
      }

      if (!job) {
        container.innerHTML = `<div class="text-center py-12 space-y-2"><p class="text-xl">❓</p><h2 class="text-base font-bold text-white">Repair Order Not Found</h2></div>`;
        return;
      }

      setupRealtimeLiveTrackerSafely(job.id);

      const amount = parseFloat(job.amount) || 0;
      const deposit = parseFloat(job.deposit_amount !== undefined ? job.deposit_amount : (job.depositAmount || 0));
      const balance = Math.max(0, amount - deposit);
      const step = job.status === 'completed' ? 4 : job.status === 'in-progress' ? 2 : 1;

      container.innerHTML = `
        <div class="text-center space-y-2 border-b border-slate-800 pb-6">
          <h2 class="text-2xl font-black text-white">AJD's Wireless Repairs</h2>
          <p class="text-xs text-slate-400 font-semibold">Live Device Repair Tracking Portal</p>
        </div>

        <div class="space-y-4">
          <div class="flex items-center justify-between text-xs font-bold">
            <span class="text-slate-400">Customer: <span class="text-white">${escapeHtml(job.customer_name || job.customerName)}</span></span>
            <span class="text-slate-400">Device: <span class="text-white">${escapeHtml(job.make_model || job.makeModel)}</span></span>
          </div>

          <div class="relative py-4">
            <div class="overflow-hidden h-3 text-xs flex rounded-full bg-slate-800">
              <div style="width: ${step === 4 ? '100%' : step === 2 ? '60%' : '25%'}" class="shadow-none flex flex-col text-center whitespace-nowrap text-white justify-center bg-brand-600 transition-all duration-700"></div>
            </div>
            <div class="grid grid-cols-3 text-[11px] font-bold text-center mt-3 text-slate-400">
              <span class="${step >= 1 ? 'text-brand-400 font-black' : ''}">1. Checked In</span>
              <span class="${step >= 2 ? 'text-brand-400 font-black' : ''}">2. Hardware Repair</span>
              <span class="${step === 4 ? 'text-emerald-400 font-black' : ''}">3. Ready For Pickup</span>
            </div>
          </div>
        </div>

        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 space-y-2 text-xs">
          <div class="flex justify-between font-semibold text-slate-300"><span>Total Cost:</span><span class="font-black text-white">$${amount.toFixed(2)}</span></div>
          <div class="flex justify-between text-indigo-400 font-semibold"><span>Deposit Paid:</span><span>-$${deposit.toFixed(2)}</span></div>
          <div class="flex justify-between text-sm font-black text-rose-400 pt-2 border-t border-slate-800"><span>Balance Due at Pickup:</span><span>$${balance.toFixed(2)}</span></div>
        </div>

        <div class="bg-brand-950/30 p-4 rounded-2xl border border-brand-900/50 space-y-1.5">
          <p class="text-[10px] font-black text-brand-400 uppercase tracking-wider">💳 Payment Handles & Pickup Info</p>
          <p class="text-xs text-slate-200 font-medium leading-relaxed">${escapeHtml(job.payment_info || job.paymentInfo || 'Zelle / Apple Pay: 786-970-7779 | Cash accepted at pickup')}</p>
        </div>
      `;
    }

    function isWebSocketAllowed() {
      try {
        if (!('WebSocket' in window)) return false;
        const testWs = new WebSocket('wss://vxpufrahrnwmtgltjstd.supabase.co/realtime/v1/websocket');
        testWs.close();
        return true;
      } catch (e) {
        return false;
      }
    }

    function setupRealtimeLiveTrackerSafely(jobId) {
      if (!supabaseClient) return;
      const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(jobId);
      if (!isUuid) return;

      if (!isWebSocketAllowed()) {
        console.warn("WebSocket connections restricted in Canvas environment. Using HTTP polling fallback.");
        startTrackPollingFallback();
        return;
      }

      try {
        if (realtimeChannel) {
          try { realtimeChannel.unsubscribe(); } catch(e){}
        }

        realtimeChannel = supabaseClient
          .channel('public:repairs_track_' + jobId)
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'repairs', filter: `id=eq.${jobId}` }, () => {
            loadTrackedJob();
          });

        realtimeChannel.subscribe((status, err) => {
          if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || err) {
            startTrackPollingFallback();
          }
        });
      } catch (e) {
        console.warn("Realtime WebSockets disallowed in this environment. Using polling:", e);
        startTrackPollingFallback();
      }
    }

    function startTrackPollingFallback() {
      if (trackPollingTimer) return;
      trackPollingTimer = setInterval(() => {
        loadTrackedJob();
      }, 10000);
    }

    window.onload = loadTrackedJob;
  </script>
</body>
</html>
