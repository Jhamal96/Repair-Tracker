<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AJD Account Security</title><link rel="stylesheet" href="./ajd-auth-glass.css"></head><body class="ajd-auth-screen"><main class="ajd-auth-card"><h1 id="heading">Account security</h1><p id="intro">Secure access to your existing account.</p><section id="recover"><form id="requestForm"><label for="email">Account email</label><input class="ajd-auth-field" id="email" type="email" autocomplete="email" required><button class="ajd-auth-button">Email password reset link</button></form><form id="updateForm" hidden><label for="password">New password (12 characters minimum)</label><input class="ajd-auth-field" id="password" type="password" autocomplete="new-password" minlength="12" required><label for="confirm">Confirm new password</label><input class="ajd-auth-field" id="confirm" type="password" autocomplete="new-password" minlength="12" required><button class="ajd-auth-button">Update password</button></form></section><section id="passkeys" hidden><p>Passkeys are optional. Keep your existing sign-in method until a passkey is successfully registered.</p><button class="ajd-auth-button" id="register" type="button">Add a passkey</button><button class="ajd-auth-button" id="login" type="button">Sign in with a passkey</button><div id="list"></div></section><p id="status" class="ajd-auth-message" role="status" aria-live="polite"></p><p><a href="./index.html">Back to application</a> · <a href="?mode=passkeys">Passkey settings</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0/dist/umd/supabase.min.js"></script><script>
const URL='https://vxpufrahrnwmtgltjstd.supabase.co',KEY='sb_publishable_tRjMtsoo9aT-6n7dzj9p-w_HsUqJ520';
const $=id=>document.getElementById(id), say=m=>$('status').textContent=m;
if(!window.supabase){say('Authentication library unavailable. Please try again later.');throw Error('Supabase unavailable')}
const sb=window.supabase.createClient(URL,KEY,{auth:{experimental:{passkey:true}}});
const mode=new URLSearchParams(location.search).get('mode');
const passkeys=mode==='passkeys';$('recover').hidden=passkeys;$('passkeys').hidden=!passkeys;
$('heading').textContent=passkeys?'Passkey security':'Reset your password';
$('intro').textContent=passkeys?'Manage passkeys for your existing account.':'Request a secure email link to set a new password.';
$('requestForm').addEventListener('submit',async e=>{e.preventDefault();say('Sending request…');const {error}=await sb.auth.resetPasswordForEmail($('email').value.trim(),{redirectTo:location.origin+location.pathname});say(error?'Unable to send request. Please try again later.':'If this account is eligible, a reset link will arrive by email.');});
let recovery=false;
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recovery=true;$('requestForm').hidden=true;$('updateForm').hidden=false;say('Recovery link verified. Choose a new password.')}});
(async()=>{const params=new URLSearchParams(location.search);if(params.get('code')){const {error}=await sb.auth.exchangeCodeForSession(params.get('code'));if(error)say('Recovery link expired or invalid. Request a new link.');else if(!passkeys){recovery=true;$('requestForm').hidden=true;$('updateForm').hidden=false;history.replaceState({},'',location.pathname)}}if(passkeys)await renderPasskeys();})();
$('updateForm').addEventListener('submit',async e=>{e.preventDefault();if(!recovery){say('Open a valid recovery email link first.');return}if($('password').value!==$('confirm').value){say('Passwords do not match.');return}const {error}=await sb.auth.updateUser({password:$('password').value});say(error?'Password update failed: '+error.message:'Password updated. You can return to your application.');if(!error){$('updateForm').reset();$('updateForm').hidden=true;recovery=false}});
async function renderPasskeys(){const {data:{user}}=await sb.auth.getUser();if(!user){$('register').disabled=true;say('Sign in to your existing account in the application before registering a passkey.');return}const {data,error}=await sb.auth.passkey.list();if(error){say('Passkey management unavailable: '+error.message);return}const list=$('list');list.replaceChildren();for(const p of data||[]){const row=document.createElement('p');row.textContent=(p.friendly_name||'Passkey')+' · '+new Date(p.created_at).toLocaleDateString()+' ';const remove=document.createElement('button');remove.textContent='Remove';remove.type='button';remove.onclick=async()=>{if(!confirm('Remove this passkey?'))return;const {error}=await sb.auth.passkey.delete({passkeyId:p.id});say(error?error.message:'Passkey removed');if(!error)renderPasskeys()};row.append(remove);list.append(row)}}
$('register').onclick=async()=>{say('Follow your device prompt…');const {error}=await sb.auth.registerPasskey();say(error?'Passkey not registered: '+error.message:'Passkey registered successfully.');if(!error)renderPasskeys()};
$('login').onclick=async()=>{say('Follow your device prompt…');const {error}=await sb.auth.signInWithPasskey();say(error?'Passkey sign-in failed: '+error.message:'Signed in. Return to your application.');if(!error)renderPasskeys()};
</script></body></html>
