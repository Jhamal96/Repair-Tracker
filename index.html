<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AJD's Wireless Repair Tracker</title>
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AJD Tracker">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8'
            }
          }
        }
      }
    }
  </script>

  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22AJD's%20Wireless%20Repair%20Tracker%22%2C%22short_name%22%3A%22AJD%20Tracker%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f8fafc%22%2C%22theme_color%22%3A%22%232563eb%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Crect%20width%3D'100'%20height%3D'100'%20rx%3D'20'%20fill%3D'%232563eb'%2F%3E%3Cpath%20d%3D'M30%2070%20L50%2030%20L70%2070%20M40%2055%20L60%2055'%20stroke%3D'white'%20stroke-width%3D'8'%20stroke-linecap%3D'round'%20fill%3D'none'%2F%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">

  <style>
    @keyframes pulse-light {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .status-pulse {
      animation: pulse-light 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 px-4 py-3 sm:px-6">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-brand-600 text-white p-2 rounded-xl shadow-md">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">AJD's Wireless Repair Tracker</h1>
          <div class="flex items-center space-x-2 text-xs text-slate-500 dark:text-slate-400">
            <span id="cloudStatusDot" class="w-2 h-2 rounded-full bg-amber-500 status-pulse"></span>
            <span id="cloudStatusText">Connecting Cloud...</span>
          </div>
        </div>
      </div>
      
      <div class="flex items-center space-x-2">
        <button id="priceModalBtn" class="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition" title="Customize Prices">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </button>
        <button id="themeToggle" class="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition" title="Toggle Dark Mode">
          <svg id="themeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

    <!-- Metrics Summary -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
        <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Total Repairs</p>
        <p id="statTotal" class="text-2xl font-black mt-1">0</p>
      </div>
      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
        <p class="text-xs font-semibold uppercase tracking-wider text-amber-500">Pending</p>
        <p id="statPending" class="text-2xl font-black mt-1">0</p>
      </div>
      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
        <p class="text-xs font-semibold uppercase tracking-wider text-emerald-500">Completed</p>
        <p id="statCompleted" class="text-2xl font-black mt-1">0</p>
      </div>
      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
        <p class="text-xs font-semibold uppercase tracking-wider text-brand-500">Revenue</p>
        <p id="statRevenue" class="text-2xl font-black mt-1">$0.00</p>
      </div>
    </div>

    <!-- Main Grid Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- Form Section -->
      <div class="lg:col-span-1">
        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 sticky top-20">
          <h2 class="text-lg font-bold mb-4 flex items-center justify-between">
            <span>New Repair Entry</span>
            <span class="text-xs font-normal text-slate-400">Syncs Live</span>
          </h2>
          
          <form id="repairForm" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Customer Name *</label>
              <input type="text" id="customerName" required class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none" placeholder="John Doe">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Device Category *</label>
              <select id="deviceType" required class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
                <option value="" disabled selected>Select category...</option>
                <option value="iPhone">iPhone</option>
                <option value="iPad">iPad</option>
                <option value="Apple watch">Apple watch</option>
                <option value="Tablets">Tablets</option>
                <option value="Galaxy">Galaxy</option>
                <option value="Galaxy Tablet">Galaxy Tablet</option>
                <option value="Laptop">Laptop</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Make & Model *</label>
              <input type="text" id="makeModel" required class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none" placeholder="e.g. iPhone 13 Pro Max">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Amount ($)</label>
              <input type="number" id="repairAmount" step="0.01" min="0" class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none" placeholder="0.00">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1 text-left">Repair Description / Issue</label>
              <textarea id="repairDescription" rows="2" class="w-full px-3 py-2 text-sm text-left bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none" placeholder="Screen crack, battery replacement, water damage..."></textarea>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Reference Links (comma separated)</label>
              <input type="text" id="repairLinks" class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none" placeholder="https://partssupplier.com/screen, https://...">
            </div>

            <button type="submit" id="submitBtn" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center space-x-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
              <span>Add Repair Job</span>
            </button>
          </form>
        </div>
      </div>

      <!-- Repairs List Section -->
      <div class="lg:col-span-2 space-y-4">
        
        <!-- Controls -->
        <div class="flex flex-col sm:flex-row gap-3">
          <div class="relative flex-1">
            <input type="text" id="searchInput" class="w-full pl-9 pr-4 py-2 text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-brand-500" placeholder="Search customer, make, model...">
            <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          </div>
          <select id="statusFilter" class="px-3 py-2 text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-brand-500">
            <option value="all">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="in-progress">In Progress</option>
            <option value="completed">Completed</option>
          </select>
        </div>

        <!-- List Container -->
        <div id="repairsList" class="space-y-3">
          <div class="p-8 text-center text-slate-400">Loading repairs from cloud...</div>
        </div>

      </div>

    </div>
  </main>

  <!-- Price Configuration Modal -->
  <div id="priceModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-3">
        <h3 class="text-lg font-bold">Customize Default Prices</h3>
        <button id="closePriceModal" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div id="priceInputs" class="space-y-3 max-h-80 overflow-y-auto pr-1"></div>

      <div class="flex justify-end space-x-2 pt-2 border-t border-slate-200 dark:border-slate-700">
        <button id="savePricesBtn" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-xl text-sm transition">Save Prices</button>
      </div>
    </div>
  </div>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://vxpufrahrnwmtgltjstd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_tRjMtsoo9aT-6n7dzj9p-w_HsUqJ520';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Initial Pricing Presets
    const defaultPrices = {
      'iPhone': 90,
      'iPad': 120,
      'Apple watch': 110,
      'Tablets': 100,
      'Galaxy': 100,
      'Galaxy Tablet': 120,
      'Laptop': 100,
      'Other': 0
    };

    let priceSettings = JSON.parse(localStorage.getItem('ajd_price_settings')) || defaultPrices;
    let repairs = [];
    let isCloudConnected = false;

    // UI Elements
    const form = document.getElementById('repairForm');
    const deviceTypeSelect = document.getElementById('deviceType');
    const repairAmountInput = document.getElementById('repairAmount');
    const repairsList = document.getElementById('repairsList');
    const searchInput = document.getElementById('searchInput');
    const statusFilter = document.getElementById('statusFilter');

    // Theme setup
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
    document.getElementById('themeToggle').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    });

    // Cloud Status UI Update
    function updateCloudStatus(connected, message) {
      isCloudConnected = connected;
      const dot = document.getElementById('cloudStatusDot');
      const text = document.getElementById('cloudStatusText');
      if (connected) {
        dot.className = "w-2 h-2 rounded-full bg-emerald-500";
        text.innerText = message || "Cloud Sync Active";
      } else {
        dot.className = "w-2 h-2 rounded-full bg-amber-500 status-pulse";
        text.innerText = message || "Local Fallback Mode";
      }
    }

    // Auto Price Filler
    deviceTypeSelect.addEventListener('change', (e) => {
      const selected = e.target.value;
      if (priceSettings[selected] !== undefined) {
        repairAmountInput.value = priceSettings[selected];
      }
    });

    // Initialize Application Data
    async function initApp() {
      try {
        const { data, error } = await supabase.from('repairs').select('*').order('created_at', { ascending: false });
        if (error) throw error;

        repairs = data || [];
        updateCloudStatus(true, "Cloud Sync Active");

        // Migrate existing local storage items to cloud if any
        const localData = JSON.parse(localStorage.getItem('ajd_repairs_backup')) || [];
        if (localData.length > 0 && repairs.length === 0) {
          const formattedLocal = localData.map(item => ({
            customer_name: item.customerName,
            device_type: item.deviceType,
            make_model: item.makeModel,
            description: item.description,
            links: item.links,
            amount: parseFloat(item.amount) || 0,
            status: item.status
          }));
          await supabase.from('repairs').insert(formattedLocal);
          localStorage.removeItem('ajd_repairs_backup');
          return initApp();
        }

      } catch (err) {
        console.warn("Cloud connection error, using local storage backup:", err);
        updateCloudStatus(false, "Offline / Local Mode");
        repairs = JSON.parse(localStorage.getItem('ajd_repairs_backup')) || [];
      }

      render();
      setupRealtimeSubscriptions();
    }

    // Realtime Supabase Sync
    function setupRealtimeSubscriptions() {
      supabase.channel('public:repairs')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'repairs' }, async () => {
          const { data } = await supabase.from('repairs').select('*').order('created_at', { ascending: false });
          if (data) {
            repairs = data;
            render();
          }
        })
        .subscribe();
    }

    // Add Job
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const linksArr = document.getElementById('repairLinks').value
        .split(',')
        .map(l => l.trim())
        .filter(l => l.length > 0);

      const newRepair = {
        customer_name: document.getElementById('customerName').value,
        device_type: deviceTypeSelect.value,
        make_model: document.getElementById('makeModel').value,
        description: document.getElementById('repairDescription').value,
        links: linksArr,
        amount: parseFloat(repairAmountInput.value) || 0,
        status: 'pending'
      };

      if (isCloudConnected) {
        const { error } = await supabase.from('repairs').insert([newRepair]);
        if (error) alert("Error adding repair: " + error.message);
      } else {
        newRepair.id = Date.now().toString();
        repairs.unshift(newRepair);
        localStorage.setItem('ajd_repairs_backup', JSON.stringify(repairs));
        render();
      }

      form.reset();
    });

    // Update Repair Status
    async function updateStatus(id, newStatus) {
      if (isCloudConnected) {
        await supabase.from('repairs').update({ status: newStatus }).eq('id', id);
      } else {
        repairs = repairs.map(r => r.id === id ? { ...r, status: newStatus } : r);
        localStorage.setItem('ajd_repairs_backup', JSON.stringify(repairs));
        render();
      }
    }

    // Delete Repair
    async function deleteRepair(id) {
      if (!confirm("Delete this repair record?")) return;
      
      if (isCloudConnected) {
        await supabase.from('repairs').delete().eq('id', id);
      } else {
        repairs = repairs.filter(r => r.id !== id);
        localStorage.setItem('ajd_repairs_backup', JSON.stringify(repairs));
        render();
      }
    }

    // Render Function
    function render() {
      const search = searchInput.value.toLowerCase();
      const status = statusFilter.value;

      const filtered = repairs.filter(item => {
        const matchesSearch = 
          (item.customer_name || item.customerName || '').toLowerCase().includes(search) ||
          (item.make_model || item.makeModel || '').toLowerCase().includes(search) ||
          (item.description || '').toLowerCase().includes(search);
        
        const matchesStatus = status === 'all' || item.status === status;
        return matchesSearch && matchesStatus;
      });

      // Update Metrics
      document.getElementById('statTotal').innerText = repairs.length;
      document.getElementById('statPending').innerText = repairs.filter(r => r.status === 'pending').length;
      document.getElementById('statCompleted').innerText = repairs.filter(r => r.status === 'completed').length;
      
      const totalRev = repairs.reduce((acc, r) => acc + (parseFloat(r.amount) || 0), 0);
      document.getElementById('statRevenue').innerText = `$${totalRev.toFixed(2)}`;

      // Render Cards
      if (filtered.length === 0) {
        repairsList.innerHTML = `<div class="p-8 text-center text-slate-400 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700">No repair jobs found.</div>`;
        return;
      }

      repairsList.innerHTML = filtered.map(item => {
        const custName = item.customer_name || item.customerName;
        const devType = item.device_type || item.deviceType;
        const model = item.make_model || item.makeModel;
        const links = item.links || [];

        return `
          <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-3">
            <div class="flex items-start justify-between">
              <div>
                <span class="inline-block px-2.5 py-0.5 text-xs font-semibold rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 mb-1">
                  ${devType}
                </span>
                <h3 class="text-base font-bold">${custName}</h3>
                <p class="text-sm font-medium text-slate-500 dark:text-slate-400">${model}</p>
              </div>
              <div class="text-right">
                <span class="text-lg font-black text-brand-600 dark:text-brand-400">$${(parseFloat(item.amount) || 0).toFixed(2)}</span>
              </div>
            </div>

            ${item.description ? `
              <p class="text-sm text-slate-600 dark:text-slate-300 text-left bg-slate-50 dark:bg-slate-900/50 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800">
                ${item.description}
              </p>
            ` : ''}

            ${links.length > 0 ? `
              <div class="flex flex-wrap gap-2 text-xs">
                ${links.map((link, idx) => `
                  <a href="${link.startsWith('http') ? link : 'https://' + link}" target="_blank" rel="noopener noreferrer" class="text-brand-600 dark:text-brand-400 hover:underline flex items-center space-x-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    <span>Link ${idx + 1}</span>
                  </a>
                `).join('')}
              </div>
            ` : ''}

            <div class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-700/60">
              <select onchange="updateStatus('${item.id}', this.value)" class="text-xs px-2.5 py-1.5 font-medium rounded-lg bg-slate-100 dark:bg-slate-700 border-none outline-none">
                <option value="pending" ${item.status === 'pending' ? 'selected' : ''}>Pending</option>
                <option value="in-progress" ${item.status === 'in-progress' ? 'selected' : ''}>In Progress</option>
                <option value="completed" ${item.status === 'completed' ? 'selected' : ''}>Completed</option>
              </select>

              <button onclick="deleteRepair('${item.id}')" class="text-slate-400 hover:text-red-500 p-1 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Modal Price Customization Logic
    const priceModal = document.getElementById('priceModal');
    const priceInputs = document.getElementById('priceInputs');

    document.getElementById('priceModalBtn').addEventListener('click', () => {
      priceInputs.innerHTML = Object.keys(priceSettings).map(cat => `
        <div class="flex items-center justify-between">
          <label class="text-sm font-medium">${cat}</label>
          <div class="flex items-center space-x-1">
            <span class="text-xs text-slate-400">$</span>
            <input type="number" step="1" value="${priceSettings[cat]}" data-cat="${cat}" class="price-edit-input w-24 px-2 py-1 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg outline-none">
          </div>
        </div>
      `).join('');
      priceModal.classList.remove('hidden');
    });

    document.getElementById('closePriceModal').addEventListener('click', () => {
      priceModal.classList.add('hidden');
    });

    document.getElementById('savePricesBtn').addEventListener('click', () => {
      document.querySelectorAll('.price-edit-input').forEach(input => {
        const cat = input.getAttribute('data-cat');
        priceSettings[cat] = parseFloat(input.value) || 0;
      });
      localStorage.setItem('ajd_price_settings', JSON.stringify(priceSettings));
      priceModal.classList.add('hidden');
    });

    // Event Listeners for Filters
    searchInput.addEventListener('input', render);
    statusFilter.addEventListener('change', render);

    // Initialize application
    initApp();
  </script>
</body>
</html>
